<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☼9k lSlay☼ - Games</title>
  <style>
    body {
      background-color: #000;
      color: #b400ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .card {
      background-color: #111;
      border: 2px solid #b400ff;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 0 25px #b400ff;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      font-size: 2.8em;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.2em;
      margin-bottom: 25px;
      color: #c27fff;
    }

    h3 {
      font-size: 1.4em;
      margin-bottom: 15px;
      color: #b400ff;
    }

    .games a, .btn {
      display: block;
      text-decoration: none;
      color: #fff;
      background-color: #b400ff;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      transition: 0.3s;
      font-weight: bold;
      border: none;
      cursor: pointer;
      width: 100%;
    }

    .games a:hover, .btn:hover {
      background-color: #7a00b3;
      transform: scale(1.05);
    }

    .section {
      margin-top: 25px;
    }

    .extra a {
      display: block;
      text-decoration: none;
      color: #fff;
      background-color: #b400ff;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      transition: 0.3s;
      font-weight: bold;
    }

    .extra a:hover {
      background-color: #7a00b3;
      transform: scale(1.05);
    }

    .side-image {
      max-width: 300px;
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 0 20px #b400ff;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>9k lSlay</h1>
      <h2>AKA deftoneslover16</h2>

      <h3>Pre-downloaded Games</h3>
      <div class="games">
        <a href="brotato/">Brotato</a>
        <a href="nfs mw 2005/">NFS Most Wanted 2005</a>
        <a href="slime rancher/">Slime Rancher</a>
      </div>

      <button class="btn" onclick="window.location.href='../index.html'">Back</button>
    </div>

    <img src="../SyntaxSeeker-code.png" alt="SyntaxSeeker Code Image" class="side-image">
  </div>
</body>
</html>
