<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☼9k lSlay☼ - Notes</title>
  <style>
    body {
      background-color: #000;
      color: #b400ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .card {
      background-color: #111;
      border: 2px solid #b400ff;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 0 25px #b400ff;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      font-size: 2.8em;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.2em;
      margin-bottom: 25px;
      color: #c27fff;
    }

    h3 {
      font-size: 1.4em;
      margin-bottom: 15px;
      color: #b400ff;
    }

    textarea {
      width: 100%;
      height: 200px;
      background-color: #222;
      color: #b400ff;
      border: 1px solid #b400ff;
      border-radius: 10px;
      padding: 10px;
      font-family: inherit;
      resize: vertical;
    }

    button {
      background-color: #b400ff;
      color: #fff;
      border: none;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background-color: #7a00b3;
      transform: scale(1.05);
    }

    .extra a {
      display: block;
      text-decoration: none;
      color: #fff;
      background-color: #b400ff;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      transition: 0.3s;
      font-weight: bold;
    }

    .extra a:hover {
      background-color: #7a00b3;
      transform: scale(1.05);
    }

    .section {
      margin-top: 25px;
    }

    .side-image {
      max-width: 300px;
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 0 20px #b400ff;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>9k lSlay</h1>
      <h2>AKA deftoneslover16</h2>

      <h3>My Notes</h3>
      <div id="notesList">
        <!-- Notes will be loaded here -->
      </div>
      <button id="refreshBtn">Refresh Notes</button>
      <button id="addNoteBtn">+ Add New Note</button>

      <button onclick="window.location.href='index.html'">Back</button>
    </div>

    <div id="editor" style="display:none;" class="card">
      <h4>Create New Note</h4>
      <input type="text" id="noteTitle" placeholder="Note Title">
      <textarea id="noteContent" placeholder="Note Content"></textarea>
      <button id="addLinkBtn">Add Link</button>
      <button id="addImageBtn">Add Image</button>
      <button id="saveBtn">Save Note</button>
      <button id="cancelBtn">Cancel</button>
    </div>

    <img src="SyntaxSeeker-code.png" alt="SyntaxSeeker Code Image" class="side-image">
  </div>

  <script>
    const addNoteBtn = document.getElementById('addNoteBtn');
    const editor = document.getElementById('editor');
    const mainCard = document.querySelector('.card');
    const noteTitle = document.getElementById('noteTitle');
    const noteContent = document.getElementById('noteContent');
    const addLinkBtn = document.getElementById('addLinkBtn');
    const addImageBtn = document.getElementById('addImageBtn');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const refreshBtn = document.getElementById('refreshBtn');

    let directoryHandle;

    addNoteBtn.onclick = async () => {
      if (!directoryHandle) await selectDirectory();
      mainCard.style.display = 'none';
      editor.style.display = 'block';
    };

    refreshBtn.onclick = loadNotes;

    addLinkBtn.onclick = () => {
      const url = prompt('Enter URL:');
      const text = prompt('Enter link text:');
      if (url && text) {
        noteContent.value += `\n<a href="${url}">${text}</a>\n`;
      }
    };

    addImageBtn.onclick = () => {
      const url = prompt('Enter image URL:');
      if (url) {
        noteContent.value += `\n<img src="${url}" alt="image">\n`;
      }
    };

    async function selectDirectory() {
      try {
        directoryHandle = await window.showDirectoryPicker();
        await loadNotes();
      } catch (error) {
        alert('Directory selection cancelled or not supported.');
      }
    }

    async function getNextNoteNumber() {
      if (!directoryHandle) await selectDirectory();
      if (!directoryHandle) return 1;
      let maxNum = 0;
      try {
        for await (const [name] of directoryHandle.entries()) {
          if (name.startsWith('note') && name.endsWith('.html')) {
            const num = parseInt(name.slice(4, -5));
            if (!isNaN(num) && num > maxNum) maxNum = num;
          }
        }
      } catch (error) {
        console.error('Error reading directory:', error);
      }
      return maxNum + 1;
    }

    async function loadNotes() {
      if (!directoryHandle) return;
      const notesList = document.getElementById('notesList');
      notesList.innerHTML = '';
      try {
        for await (const [name] of directoryHandle.entries()) {
          if (name.startsWith('note') && name.endsWith('.html')) {
            const link = document.createElement('a');
            link.href = `notes/${name}`;
            link.textContent = name.replace('.html', '').replace('note', 'Note ');
            link.style.display = 'block';
            link.style.color = '#b400ff';
            link.style.textDecoration = 'none';
            link.style.margin = '8px 0';
            notesList.appendChild(link);
          }
        }
      } catch (error) {
        console.error('Error loading notes:', error);
      }
    }

    saveBtn.onclick = async () => {
      const title = noteTitle.value.trim();
      const content = noteContent.value.trim();
      if (!title || !content) {
        alert('Please enter title and content.');
        return;
      }
      const num = await getNextNoteNumber();
      if (!directoryHandle) return;
      const filename = `note${num}.html`;
      try {
        const fileHandle = await directoryHandle.getFileHandle(filename, { create: true });
        const writable = await fileHandle.createWritable();
        const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${title}</title>
  <style>
    body {
      background-color: #000;
      color: #b400ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }
    h1 {
      color: #b400ff;
    }
    p, div {
      color: #c27fff;
    }
    a {
      color: #b400ff;
      text-decoration: none;
    }
    a:hover {
      color: #7a00b3;
    }
    img {
      max-width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>${title}</h1>
  <div>${content.replace(/\n/g, '<br>')}</div>
  <a href="../notes.html">Back to Notes</a>
</body>
</html>`;
        await writable.write(html);
        await writable.close();
        alert(`Note saved as ${filename}`);
        await loadNotes();
        editor.style.display = 'none';
        mainCard.style.display = 'block';
        noteTitle.value = '';
        noteContent.value = '';
      } catch (error) {
        alert('Error saving note: ' + error.message);
      }
    };
  </script>
</body>
</html>
