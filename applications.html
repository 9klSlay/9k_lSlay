<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☼9k lSlay☼ - Applications</title>
  <style>
    body {
      background-color: #000;
      color: #b400ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .card {
      background-color: #111;
      border: 2px solid #b400ff;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 0 25px #b400ff;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      font-size: 2.8em;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.2em;
      margin-bottom: 25px;
      color: #c27fff;
    }

    h3 {
      font-size: 1.4em;
      margin-bottom: 15px;
      color: #b400ff;
    }

    .links a, .extra a, .apps button, .btn {
      display: block;
      text-decoration: none;
      color: #fff;
      background-color: #b400ff;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      transition: 0.3s;
      font-weight: bold;
      border: none;
      cursor: pointer;
      width: 100%;
    }

    .links a:hover, .extra a:hover, .apps button:hover, .btn:hover {
      background-color: #7a00b3;
      transform: scale(1.05);
    }

    .section {
      margin-top: 25px;
    }

    .side-image {
      max-width: 300px;
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 0 20px #b400ff;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>9k lSlay</h1>
      <h2>AKA deftoneslover16</h2>

      <h3>My Favorite Apps</h3>
      <div class="apps">
        <button onclick="alert('Visual Studio Code - My code editor!')">Visual Studio Code</button>
        <button onclick="alert('Discord - For chatting with friends!')">Discord</button>
        <button onclick="alert('Roblox - My favorite game!')">Roblox</button>
        <button onclick="alert('Instagram - For sharing pics!')">Instagram</button>
        <button onclick="alert('YouTube - For watching videos!')">YouTube</button>
      </div>

      <button class="btn" onclick="window.location.href='test.html'">Back</button>
    </div>

    <img src="SyntaxSeeker-code.png" alt="SyntaxSeeker Code Image" class="side-image">
  </div>
</body>
</html>
