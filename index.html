  <!--
    SPARKS + SPIDERMAN RANDOM EVENT
  -->
  <script>

    /*
      ================================
      PURPLE MOUSE SPARKS
      ================================
    */

    const clickableElements = document.querySelectorAll(
      'a, button, input, select, textarea, [role="button"]'
    );

    clickableElements.forEach(element => {

      element.addEventListener('mouseenter', () => {
        element.classList.add('clickable-glow');
      });

      element.addEventListener('mouseleave', () => {
        element.classList.remove('clickable-glow');
      });

      element.addEventListener('click', (event) => {

        for (let i = 0; i < 12; i++) {
          createSpark(event.clientX, event.clientY);
        }

      });

    });


    function createSpark(x, y) {

      const spark = document.createElement('div');

      spark.classList.add('spark');

      spark.style.left = `${x}px`;
      spark.style.top = `${y}px`;

      const angle = Math.random() * Math.PI * 2;
      const distance = 25 + Math.random() * 45;

      spark.style.setProperty(
        '--x',
        `${Math.cos(angle) * distance}px`
      );

      spark.style.setProperty(
        '--y',
        `${Math.sin(angle) * distance}px`
      );

      document.body.appendChild(spark);

      setTimeout(() => {
        spark.remove();
      }, 600);

    }


    /*
      ================================
      SPIDERMAN RANDOM EVENT
      ================================

      1/500 cada segundo.
    */

    setInterval(() => {

      const chance = Math.floor(Math.random() * 500);

      if (chance === 0) {
        playSpiderman();
      }

    }, 1000);


    function playSpiderman() {

      // Evita que aparezcan varios videos simultáneamente.
      if (document.querySelector('.spiderman-video')) {
        return;
      }

      const video = document.createElement('video');

      video.classList.add('spiderman-video');

      video.src = 'spiderman.mp4';

      video.autoplay = true;
      video.controls = false;

      document.body.appendChild(video);

      video.play().catch(() => {
        /*
          Algunos navegadores bloquean reproducción automática
          con sonido si el usuario todavía no ha interactuado.
        */
      });

      video.addEventListener('ended', () => {
        video.remove();
      });

    }

  </script>

</body>
